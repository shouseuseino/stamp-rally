<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタンプラリー</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>🎉 スタンプラリー</h1>

    <p>スタンプを集めよう！</p>

    <div class="stamp-count">
      スタンプ <span id="count">0</span> / 5
    </div>

    <div id="message"></div>

<div class="spots">
    <button onclick="startQR(1)">スポット1<br>QRコードを読み取る</button>
    <button onclick="startQR(2)">スポット2<br>QRコードを読み取る</button>
    <button onclick="startQR(3)">スポット3<br>QRコードを読み取る</button>
    <button onclick="startQR(4)">スポット4<br>QRコードを読み取る</button>
    <button onclick="startQR(5)">スポット5<br>QRコードを読み取る</button>
</div>

<div id="reader" style="width:300px; margin:20px auto;"></div>
<div id="qr-message"></div>
  </div>

  <script src="script.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

<script>
let currentSpot = null;
let scanner = null;

function startQR(spot) {
    currentSpot = spot;

    document.getElementById("qr-message").textContent =
        "スポット" + spot + "のQRコードを読み取ってください";

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },
        function(decodedText) {
            checkQR(decodedText);
        },
        function(errorMessage) {
            // 読み取り中のエラーなので何もしない
        }
    ).catch(function(err) {
        document.getElementById("qr-message").textContent =
            "カメラを起動できませんでした";
    });
}

function checkQR(code) {

    const correctCode = "stamp-" + currentSpot;

    if (code === correctCode) {

        scanner.stop().then(function() {

            document.getElementById("qr-message").textContent =
                "🎉 スポット" + currentSpot + "のスタンプGET！";

            getStamp(currentSpot);

        });

    } else {

        document.getElementById("qr-message").textContent =
            "❌ 違うQRコードです。もう一度読み取ってください。";
    }
}
</script>
</body>
</html>
