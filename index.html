    <div class="spots">

      <button onclick="getStamp(2)">スポット2<br>スタンプGET</button>
      <button onclick="getStamp(3)">スポット3<br>スタンプGET</button>
      <button onclick="getStamp(4)">スポット4<br>スタンプGET</button>
      <button onclick="getStamp(5)">スポット5<br>スタンプGET</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
