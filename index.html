<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スタンプラリー</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
    }

    h1 {
      font-size: 32px;
    }

    .stamp-count {
      font-size: 28px;
      font-weight: bold;
      margin: 25px 0;
    }

    #reader {
      width: 100%;
      max-width: 350px;
      margin: 20px auto;
    }

    #message {
      font-size: 20px;
      margin: 20px 0;
      font-weight: bold;
    }

    #qr-message {
      font-size: 18px;
      margin: 15px 0;
    }

    .qr-button {
      font-size: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }

    .qr-button:hover {
      opacity: 0.8;
    }

    .stamps {
      margin-top: 30px;
    }

    .stamp {
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      background: #eee;
    }

    .get {
      background: #d9ffd9;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎉 スタンプラリー</h1>

    <p>QRコードを読み取ってスタンプを集めよう！</p>

    <div class="stamp-count">
      スタンプ <span id="count">0</span> / 5
    </div>

    <div id="message">
      「QRを読み取る」を押してください
    </div>

    <!-- QR読み取りボタン -->
    <button class="qr-button" onclick="startQR()">
      📷 QRを読み取る
    </button>

    <!-- QRコード読み取り画面 -->
    <div id="reader" style="display:none;"></div>

    <div id="qr-message"></div>

    <!-- スタンプ一覧 -->
    <div class="stamps">

      <div id="stamp1" class="stamp">
        スポット1
      </div>

      <div id="stamp2" class="stamp">
        スポット2
      </div>

      <div id="stamp3" class="stamp">
        スポット3
      </div>

      <div id="stamp4" class="stamp">
        スポット4
      </div>

      <div id="stamp5" class="stamp">
        スポット5
      </div>

    </div>

  </div>

  <!-- QRコード読み取りライブラリ -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- 自分のJavaScript -->
  <script src="script.js"></script>

</body>
</html>
