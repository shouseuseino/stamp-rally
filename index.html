<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スタンプラリー</title>

  <!-- デザイン設定 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🎉 スタンプラリー</h1>

    <p>QRコードを読み取ってスタンプを集めよう！</p>

    <div class="stamp-count">
      スタンプ <span id="count">0</span> / 5
    </div>

    <div id="message">
      「QRを読み取る」を押してください
    </div>

    <!-- QR読み取りボタン -->
    <button class="qr-button" onclick="startQR()">
      📷 QRを読み取る
    </button>

    <!-- QRコード読み取り画面 -->
    <div id="reader"></div>

    <div id="qr-message"></div>

    <!-- スタンプ一覧 -->
    <div class="stamps">

      <div id="stamp1" class="stamp">
        スポット1
      </div>

      <div id="stamp2" class="stamp">
        スポット2
      </div>

      <div id="stamp3" class="stamp">
        スポット3
      </div>

      <div id="stamp4" class="stamp">
        スポット4
      </div>

      <div id="stamp5" class="stamp">
        スポット5
      </div>

    </div>

  </div>

  <!-- QRコード読み取りライブラリ -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- 自分のJavaScript -->
  <script src="script.js"></script>

</body>
</html>
